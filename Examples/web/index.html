<!doctype html>
<html lang="en" data-state="loading">
  <head>
    <meta charset="utf-8">
    <!-- One CSS pixel per Qt device independent pixel, as in the page generated by Qt. -->
    <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0">
    <meta name="description"
          content="Hand Painting For Qt: Qt widgets painted by hand, Rough.js style. The example application runs in this page with Qt for WebAssembly.">
    <title>Hand Painting For Qt</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M5 6c7-2 15-1 22 0c1 7 1 14-1 21c-7 1-14 1-21-1c-1-7-1-13 0-20z' fill='%23fdfcf7' stroke='%232b2b2b' stroke-width='2.5' stroke-linejoin='round'/%3E%3Cpath d='M10 21l5-9l3 6l4-8' fill='none' stroke='%232a6fdb' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <style>
      @font-face {
        font-family: "Architects Daughter";
        src: url("fonts/ArchitectsDaughter-Regular.ttf") format("truetype");
        font-display: swap;
      }

      :root {
        --paper: #fdfcf7;
        --ink: #2b2b2b;
        --accent: #2a6fdb;
        color-scheme: light;
      }

      /* The page never scrolls: the application fills what the header leaves. */
      html, body { height: 100%; margin: 0; overflow: hidden; }

      body {
        display: flex;
        flex-direction: column;
        background: var(--paper);
        color: var(--ink);
        font-family: "Architects Daughter", "Segoe Print", "Bradley Hand", cursive;
      }

      header {
        flex: none;
        display: flex;
        align-items: baseline;
        gap: 1rem;
        padding: 0.35rem 1rem;
        border-bottom: 2px solid var(--ink);
      }

      h1 { margin: 0; font-size: 1.15rem; white-space: nowrap; }

      header p {
        flex: 1;
        min-width: 0;
        margin: 0;
        font-size: 0.9rem;
        opacity: 0.75;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      a { color: var(--accent); white-space: nowrap; }

      main { flex: 1; min-height: 0; position: relative; }

      /* Qt puts the windows of the application in this element. */
      #screen { position: absolute; inset: 0; }

      #status {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: 1rem;
        text-align: center;
        font-size: 1.25rem;
        background: var(--paper);
      }

      html[data-state="running"] #status { display: none; }

      #pencil {
        width: 3rem;
        height: 3rem;
        border: 3px solid var(--ink);
        border-top-color: transparent;
        border-radius: 48% 52% 50% 50% / 52% 48% 52% 48%;
        animation: turn 1.1s linear infinite;
      }

      html:not([data-state="loading"]) #pencil { display: none; }

      @keyframes turn { to { transform: rotate(360deg); } }

      @media (prefers-reduced-motion: reduce) {
        #pencil { animation: none; }
      }

      @media (max-width: 40rem) {
        header p { display: none; }
        header { justify-content: space-between; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Hand Painting For Qt</h1>
      <p>Qt widgets painted by hand, running here with Qt for WebAssembly</p>
      <a href="https://github.com/qnope/HandPaintingForQt">Source on GitHub</a>
    </header>
    <main>
      <div id="screen"></div>
      <div id="status" role="status">
        <div id="pencil" aria-hidden="true"></div>
        <span id="status-text">Loading the application…</span>
        <noscript>This page needs JavaScript to run the application.</noscript>
      </div>
    </main>

    <!-- Both files are produced by the Qt for WebAssembly build of HandPaintingExample. -->
    <script src="HandPaintingExample.js"></script>
    <script src="qtloader.js"></script>
    <script>
      // data-state on <html>: loading, running, exited or failed.
      function set_state(state, message)
      {
          document.documentElement.dataset.state = state;
          if (message !== undefined)
              document.querySelector('#status-text').textContent = message;
      }

      // Phones. To open the virtual keyboard, Qt gives the focus to a text field it keeps hidden
      // in the page, when a text widget is tapped. Qt reads the tap from the pointer events; the
      // browser then makes mouse events of the same tap, and Safari on iOS takes the focus away
      // with them: the keyboard closes as soon as it opens. Cancelling the end of the touch tells
      // the browser to make no mouse event; the pointer events are not affected.
      // Only for the contents of the windows: their title bars need the click.
      function keep_focus_after_tap(screen_element)
      {
          screen_element.addEventListener('touchend', event => {
              const in_window_contents = event.composedPath().some(
                  element => element.classList?.contains('qt-window-contents'));
              if (in_window_contents && event.cancelable)
                  event.preventDefault();
          }, { capture: true, passive: false });
      }

      // The hidden text field of Qt is added to <body> when the application starts. Qt inserts
      // what is typed in it but does not follow a word replaced as a whole: the corrections of
      // the keyboard are switched off. 16px keeps Safari on iOS from zooming on the field.
      function configure_text_field_of_qt()
      {
          new MutationObserver(mutations => {
              for (const mutation of mutations) {
                  for (const node of mutation.addedNodes) {
                      if (node.tagName !== 'INPUT')
                          continue;
                      node.setAttribute('autocorrect', 'off');
                      node.setAttribute('autocomplete', 'off');
                      node.setAttribute('spellcheck', 'false');
                      node.style.fontSize = '16px';
                  }
              }
          }).observe(document.body, { childList: true });
      }

      async function start_application()
      {
          const entry_function = window.HandPaintingExample_entry;
          if (typeof qtLoad !== 'function' || typeof entry_function !== 'function') {
              set_state('failed', 'The application files are missing from this page.');
              return;
          }
          if (typeof WebAssembly !== 'object') {
              set_state('failed', 'This browser does not support WebAssembly.');
              return;
          }

          keep_focus_after_tap(document.querySelector('#screen'));
          configure_text_field_of_qt();
          try {
              await qtLoad({
                  qt: {
                      onLoaded: () => set_state('running'),
                      onExit: exit_data => {
                          const details = exit_data.text !== undefined ? ` (${exit_data.text})` : '';
                          set_state('exited', `The application stopped${details}. Reload the page to start it again.`);
                      },
                      entryFunction: entry_function,
                      containerElements: [document.querySelector('#screen')],
                  }
              });
          } catch (error) {
              console.error(error);
              set_state('failed', `The application could not start: ${error.message ?? error}`);
          }
      }

      start_application();
    </script>
  </body>
</html>
