name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QtVersion: '6.8.3'
  # vcpkg release used to build the dependencies of vcpkg.json (gtest).
  VcpkgTag: '2026.10.16'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (MSVC)
            os: windows-latest
          - name: macOS (clang)
            os: macos-latest
          - name: Linux (gcc)
            os: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libfontconfig1-dev \
            libdbus-1-3 fonts-dejavu-core

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QtVersion }}
          cache: true

      - name: Restore vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ env.VcpkgTag }}-${{ hashFiles('vcpkg.json') }}

      # The project expects vcpkg next to the repository, at ../vcpkg.
      - name: Set up vcpkg
        run: |
          git clone --depth 1 --branch "$VcpkgTag" https://github.com/microsoft/vcpkg.git ../vcpkg
          if [ "$RUNNER_OS" = "Windows" ]; then
            ../vcpkg/bootstrap-vcpkg.bat -disableMetrics
          else
            ../vcpkg/bootstrap-vcpkg.sh -disableMetrics
          fi
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-cache" >> "$GITHUB_ENV"

      # On Windows the offscreen platform does not read the system fonts: without a font
      # directory, Qt warns and the application test reports an unexpected warning.
      - name: Give the offscreen platform the Windows fonts
        if: runner.os == 'Windows'
        run: echo "QT_QPA_FONTDIR=C:/Windows/Fonts" >> "$GITHUB_ENV"

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake
          "-DCMAKE_PREFIX_PATH:PATH=$QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          # Qt messages go to the log, also for a test stopped by the timeout.
          QT_FORCE_STDERR_LOGGING: 1
        run: ctest --test-dir build -C Debug --output-on-failure --timeout 120

  # The oldest supported Qt: the one packaged by Ubuntu 24.04, with GoogleTest from apt as well.
  linux-qt-6-4:
    name: Linux (gcc, Qt 6.4)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Qt 6.4 and GoogleTest from apt
        run: scripts/InstallUbuntuDependencies.sh

      - name: Check that Qt is 6.4
        run: |
          qmake6 -query QT_VERSION
          qmake6 -query QT_VERSION | grep -q '^6\.4\.'

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          QT_FORCE_STDERR_LOGGING: 1
        run: ctest --test-dir build --output-on-failure --timeout 120
