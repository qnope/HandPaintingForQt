name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QtVersion: '6.8.3'
  # vcpkg release used to build the dependencies of vcpkg.json (gtest).
  VcpkgTag: '2026.10.16'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (MSVC)
            os: windows-latest
          - name: macOS (clang)
            os: macos-latest
          - name: Linux (gcc)
            os: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libfontconfig1-dev \
            libdbus-1-3 fonts-dejavu-core

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QtVersion }}
          cache: true

      - name: Restore vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ env.VcpkgTag }}-${{ hashFiles('vcpkg.json') }}

      # The project expects vcpkg next to the repository, at ../vcpkg.
      - name: Set up vcpkg
        run: |
          git clone --depth 1 --branch "$VcpkgTag" https://github.com/microsoft/vcpkg.git ../vcpkg
          if [ "$RUNNER_OS" = "Windows" ]; then
            ../vcpkg/bootstrap-vcpkg.bat -disableMetrics
          else
            ../vcpkg/bootstrap-vcpkg.sh -disableMetrics
          fi
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-cache" >> "$GITHUB_ENV"

      # On Windows the offscreen platform does not read the system fonts: without a font
      # directory, Qt warns and the application test reports an unexpected warning.
      - name: Give the offscreen platform the Windows fonts
        if: runner.os == 'Windows'
        run: echo "QT_QPA_FONTDIR=C:/Windows/Fonts" >> "$GITHUB_ENV"

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake
          "-DCMAKE_PREFIX_PATH:PATH=$QT_ROOT_DIR"

      # --parallel without a number is "make -j" with no limit: every file of a target is
      # compiled at once, the runner runs out of memory and the build crawls or is killed.
      - name: Build
        run: cmake --build build --config Debug --parallel 4

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          # Qt messages go to the log, also for a test stopped by the timeout.
          QT_FORCE_STDERR_LOGGING: 1
        run: ctest --test-dir build -C Debug --output-on-failure --timeout 120

      # The window of Examples/Integration in each theme, as in the README (tools/screenshots).
      - name: Upload the screenshots of the themes
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: theme-screenshots
          path: build/tools/screenshots/images
          if-no-files-found: ignore

      # The paths given to CMake below have forward slashes: on Windows, cygpath -m turns D:\a\x into D:/a/x.
      - name: Install hpq
        run: |
          to_cmake_path() { if [ "$RUNNER_OS" = "Windows" ]; then cygpath -m "$1"; else echo "$1"; fi; }
          echo "HPQ_PREFIX=$(to_cmake_path "$RUNNER_TEMP/hpq")" >> "$GITHUB_ENV"
          echo "QT_PREFIX=$(to_cmake_path "$QT_ROOT_DIR")" >> "$GITHUB_ENV"
          echo "HPQ_SOURCE=$(to_cmake_path "$GITHUB_WORKSPACE")" >> "$GITHUB_ENV"
          cmake --install build --config Debug --prefix "$(to_cmake_path "$RUNNER_TEMP/hpq")"

      # An application that uses the installed hpq, with find_package(HandPaintingForQt).
      - name: Integration with find_package
        run: |
          cmake -S Examples/Integration -B build-find-package -DCMAKE_BUILD_TYPE=Debug \
            "-DCMAKE_PREFIX_PATH=$HPQ_PREFIX;$QT_PREFIX"
          cmake --build build-find-package --config Debug --parallel 4
          ctest --test-dir build-find-package -C Debug --output-on-failure --timeout 120

      # The same application with hpq built as a subproject, by FetchContent. The release is not
      # downloaded: FETCHCONTENT_SOURCE_DIR_HANDPAINTINGFORQT gives FetchContent this checkout.
      - name: Integration with FetchContent
        run: |
          cmake -S Examples/Integration -B build-fetch-content -DCMAKE_BUILD_TYPE=Debug \
            -DGALLERY_HPQ_SOURCE=FetchContent \
            "-DFETCHCONTENT_SOURCE_DIR_HANDPAINTINGFORQT=$HPQ_SOURCE" \
            "-DCMAKE_PREFIX_PATH=$QT_PREFIX"
          cmake --build build-fetch-content --config Debug --parallel 4
          ctest --test-dir build-fetch-content -C Debug --output-on-failure --timeout 120

      # The same application with this checkout added by add_subdirectory, as a git submodule would be.
      - name: Integration with add_subdirectory
        run: |
          cmake -S Examples/Integration -B build-add-subdirectory -DCMAKE_BUILD_TYPE=Debug \
            -DGALLERY_HPQ_SOURCE=add_subdirectory \
            "-DCMAKE_PREFIX_PATH=$QT_PREFIX"
          cmake --build build-add-subdirectory --config Debug --parallel 4
          ctest --test-dir build-add-subdirectory -C Debug --output-on-failure --timeout 120
