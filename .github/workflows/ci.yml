name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  cmake:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            qt_arch: ""
          - os: macos-latest
            qt_arch: ""
          - os: windows-latest
            qt_arch: win64_msvc2022_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: ${{ matrix.qt_arch }}
          cache: true
      - name: Configure
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
      - name: Build
        run: cmake --build build --config Debug
      - name: Diagnose Windows hang (temporary)
        if: runner.os == 'Windows'
        timeout-minutes: 3
        env:
          QT_LOGGING_RULES: "*=true"
        run: |
          for exe in $(find build -name 'HandPaintingExample.exe' -o -name 'HandPaintingExampleTests.exe'); do
            echo "=== $exe"
            HPQ_AUTO_QUIT=1 timeout 30 "$exe" 2>&1 | tail -40 || true
          done
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure --timeout 120 -V
