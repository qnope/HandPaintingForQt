name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  cmake:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            qt_arch: ""
          - os: macos-latest
            qt_arch: ""
          - os: windows-latest
            qt_arch: win64_msvc2022_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: ${{ matrix.qt_arch }}
          cache: true
      - name: Configure
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
      - name: Build
        run: cmake --build build --config Debug
      - name: Diagnose Windows hang (temporary)
        if: runner.os == 'Windows'
        timeout-minutes: 3
        env:
          QT_LOGGING_RULES: "*=true"
        run: |
          T=build/Examples/tests/Debug/HandPaintingExampleTests.exe
          A=build/Examples/Debug/HandPaintingExample.exe
          echo "=== tests without Startup"
          timeout 60 $T --gtest_filter=-Startup.* 2>&1 | tail -30 || true
          echo "=== app, platform windows"
          QT_QPA_PLATFORM=windows HPQ_AUTO_QUIT=1 timeout 30 $A 2>&1 | tail -20; echo "exit ${PIPESTATUS[0]}"
          echo "=== app, offscreen, plugin debug"
          QT_DEBUG_PLUGINS=1 HPQ_AUTO_QUIT=1 timeout 30 $A 2>&1 | tail -20; echo "exit ${PIPESTATUS[0]}"
          echo "=== startup test, platform windows"
          QT_QPA_PLATFORM=windows timeout 30 $T --gtest_filter=Startup.* 2>&1 | tail -20; echo "exit ${PIPESTATUS[0]}"
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure --timeout 120 -V
