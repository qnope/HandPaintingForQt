name: Release

# Publishes the GitHub release of a version, with its section of CHANGELOG.md as notes:
# - when its tag, v<major>.<minor>.<patch>, is pushed: git tag v0.1.0 && git push origin v0.1.0;
# - or by hand (Actions > Release > Run workflow, with the version): the tag is then created on
#   the last commit of the branch the workflow runs on.
# The version must be the one of the project in CMakeLists.txt, of vcpkg.json and of a section of
# CHANGELOG.md (cmake/CheckVersions.cmake).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, as 0.1.0 (creates the tag v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Find the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$version is not a version major.minor.patch"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Check that the project, vcpkg.json and CHANGELOG.md have this version
        run: cmake -DVERSION="$VERSION" -DSOURCE_DIR=. -P cmake/CheckVersions.cmake

      # The lines between "## [<version>]" and the next section or the links at the end.
      - name: Take the notes from CHANGELOG.md
        run: |
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { in_section = 1; next }
            in_section && (/^## \[/ || /^\[[^]]*\]: /) { exit }
            in_section { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          {
            echo
            echo "To use it in a CMake project, see [Use hpq in your project](https://github.com/$GITHUB_REPOSITORY/blob/v$VERSION/README.md#use-hpq-in-your-project)."
          } >> "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            target=(--verify-tag)
          else
            target=(--target "$GITHUB_SHA")
          fi
          gh release create "v$VERSION" "${target[@]}" \
            --title "Hand Painting for Qt $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
